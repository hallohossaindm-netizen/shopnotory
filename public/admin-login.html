<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন লগইন | ShopnoTory (স্বপ্নতরী)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              800: '#1b4332',
              900: '#143d2b',
              950: '#0f291e',
            },
            cream: {
              50: '#fbf9f4',
              100: '#f4efe6',
              200: '#e5e1d4',
            }
          },
          fontFamily: {
            bengali: ['"Hind Siliguri"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
    }
  </style>
</head>
<body class="bg-[#fbf9f4] text-stone-900 min-h-screen flex flex-col justify-between selection:bg-[#143d2b] selection:text-white">

  <!-- টপবার / হটলাইন বার -->
  <header class="bg-[#143d2b] text-white py-2.5 px-4 text-xs font-medium border-b border-[#2d6a4f]/40">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-[#b8d56d] animate-pulse"></span>
        <span>অফিসিয়াল অ্যাডমিন গেটওয়ে</span>
      </div>
      <div class="flex items-center gap-3">
        <span>হটলাইন ও সহায়তা:</span>
        <a href="tel:01845805713" class="text-[#b8d56d] font-bold hover:underline tracking-wide">01845805713</a>
      </div>
    </div>
  </header>

  <!-- প্রধান লগইন কন্টেইনার -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-[#e5e1d4] overflow-hidden">
      
      <!-- হেডার ব্যানার -->
      <div class="bg-gradient-to-br from-[#143d2b] via-[#1b4332] to-[#0f291e] p-8 text-center text-white relative">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur border border-white/20 mb-3 shadow-inner">
          <svg class="w-8 h-8 text-[#b8d56d]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">ShopnoTory অ্যাডমিন</h1>
        <p class="text-xs text-stone-200 mt-1">প্যানেল সুরক্ষায় Firebase Authentication সক্রিয়</p>
      </div>

      <!-- ফর্ম এরিয়া -->
      <div class="p-6 sm:p-8">
        
        <!-- সাকসেস মেসেজ বক্স -->
        <div id="success-message" class="hidden mb-5 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold flex items-center gap-2">
        </div>

        <!-- এরর মেসেজ বক্স -->
        <div id="error-message" class="hidden mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
        </div>

        <form id="login-form" class="space-y-4">
          <!-- ইমেইল ফিল্ড -->
          <div>
            <label for="email-input" class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">
              অ্যাডমিন ইমেইল <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <input 
                type="email" 
                id="email-input" 
                required 
                placeholder="admin@shopnotory.com"
                autocomplete="email"
                class="w-full px-4 py-3 rounded-2xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-[#143d2b] focus:border-transparent text-sm bg-stone-50/50 hover:bg-white transition"
              />
            </div>
          </div>

          <!-- পাসওয়ার্ড ফিল্ড -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password-input" class="block text-xs font-bold text-stone-700 uppercase tracking-wider">
                পাসওয়ার্ড <span class="text-rose-500">*</span>
              </label>
              <button 
                type="button" 
                id="forgot-password-link" 
                class="text-xs font-bold text-[#143d2b] hover:underline"
              >
                পাসওয়ার্ড ভুলে গেছেন?
              </button>
            </div>
            <div class="relative">
              <input 
                type="password" 
                id="password-input" 
                required 
                placeholder="••••••••"
                autocomplete="current-password"
                class="w-full px-4 py-3 rounded-2xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-[#143d2b] focus:border-transparent text-sm bg-stone-50/50 hover:bg-white transition"
              />
            </div>
          </div>

          <!-- সাবমিট বাটন -->
          <button 
            type="submit" 
            id="login-btn"
            class="w-full mt-2 py-3.5 px-4 bg-[#143d2b] hover:bg-[#1b4332] text-white font-bold rounded-2xl shadow-lg shadow-[#143d2b]/20 hover:shadow-xl transition duration-200 flex items-center justify-center gap-2 text-sm"
          >
            লগইন করুন
          </button>
        </form>

        <!-- হেল্প ও ব্যাক লিংক -->
        <div class="mt-6 pt-6 border-t border-stone-200 text-center space-y-2">
          <p class="text-xs text-stone-500">
            জরুরি প্রয়োজনে কল করুন: <a href="tel:01845805713" class="text-[#143d2b] font-bold hover:underline">01845805713</a>
          </p>
          <div>
            <a href="/" class="inline-flex items-center gap-1 text-xs text-stone-600 hover:text-[#143d2b] font-medium transition">
              ← মূল ওয়েবসাইট (হোমপেজ)-এ ফিরে যান
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ফুটার -->
  <footer class="py-4 text-center text-xs text-stone-500 border-t border-[#e5e1d4] bg-white/50">
    <p>© ShopnoTory (স্বপ্নতরী) — সর্বস্বত্ব সংরক্ষিত | হটলাইন: 01845805713</p>
  </footer>

  <!-- স্ক্রিপ্ট লোড (ES Module) -->
  <script type="module" src="./admin-auth.js"></script>
</body>
</html>
